name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The oldest Python the Pi runs: Raspberry Pi OS Bookworm.
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Development environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: scripts/check.sh
        run: scripts/check.sh --verbose
