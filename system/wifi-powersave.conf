# Installed to /etc/NetworkManager/conf.d/ by scripts/install.sh.
# WLAN power saving off for every client network, also the profiles netplan
# writes. The Pi is a server on a power supply: with power saving on, the
# first packet after a pause waits for the radio to wake up (measured on a
# Pi 3, 09.11.2026: ping every 1 s 19 ms on average and up to 227 ms, every
# 0.1 s 6.5 ms). The hotspot sets the same per profile in host-helper.sh.
# 2 = disable (NetworkManager's values: 0 default, 1 ignore, 2 disable,
# 3 enable).
[connection]
wifi.powersave = 2
