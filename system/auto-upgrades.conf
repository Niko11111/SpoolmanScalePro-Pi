// Installed to /etc/apt/apt.conf.d/20auto-upgrades by scripts/install.sh.
// Security updates from Debian, every day, by unattended-upgrades. Its own
// rules decide what that means (Debian-Security only by default); kernel
// and firmware from the Raspberry Pi repository are installed from the
// System page instead, where the restart they need is offered.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
// Never restart on its own: a restart in the middle of weighing or of a
// fair day is worse than a fix that waits for the next one.
Unattended-Upgrade::Automatic-Reboot "false";
